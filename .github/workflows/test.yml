name: Test

# Compile and test the CLI on supported Node release lines; browser test of the built sites on Node 22;
# discovery tests on macOS, where the real sandbox-exec and plutil exist.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Timing checks run alone, after the suite, so elapsed time is meaningful.
      - run: npm run test:perf
  browser:
    # Playwright (Chromium) on the built Northwind sites served under /full/ and /staff/; see test/browser/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  macos:
    # Discovery on a real Mac runner: the darwin-only tests (test/integration/discover-sandbox.test.ts:
    # the sandbox denies writes and network, the time limit, the program environment, a run under the
    # Node permission model) plus the other discovery tests. Fake programs only; nothing is installed.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run test/unit/annotations.test.ts test/unit/discovery- test/integration/discover
