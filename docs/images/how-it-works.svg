<svg xmlns="http://www.w3.org/2000/svg" width="800" height="714.29" viewBox="0 0 560 500" role="img" aria-labelledby="how-it-works-title how-it-works-desc" font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="how-it-works-title">How stackledger publishes a catalogue</title>
  <desc id="how-it-works-desc">Flowchart. On your Mac, stackledger discover writes a snapshot that stays there, and drift --scaffold suggests entries as you edit catalog/*.yaml. A git push sends the catalogue to the catalogue repository, a private GitHub repository with GitHub Actions. From the repository, a pull request runs gitleaks, validate and build and never deploys; a push to main runs gitleaks, validate and build, with stackledger taken from the npm registry by npx @brunosouzas/stackledger. wrangler pages deploy sends the whole static site to Cloudflare Pages, which never reads GitHub. A reader goes through Cloudflare Access, signing in first, to reach Pages.</desc>
