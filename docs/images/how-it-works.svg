<svg xmlns="http://www.w3.org/2000/svg" width="800" height="808" viewBox="0 0 800 808" role="img" aria-labelledby="hiw-t hiw-d" font-family="Lato, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="hiw-t">How stackledger publishes a catalogue</title>
  <desc id="hiw-d">Flowchart. On your Mac, stackledger discover writes a snapshot that stays on the Mac, and drift --scaffold helps you edit catalog/*.yaml. A git push sends the catalogue to a private GitHub repository. A pull request runs gitleaks, validate and build but never deploys. A push to main runs gitleaks, validate and build with stackledger from the npm registry, then wrangler pages deploy publishes the whole static site to Cloudflare Pages, which never reads GitHub. A reader reaches Pages only through Cloudflare Access, signing in first. Personal mode: the full site only, one Access application for the owner, / leads to /full/. Corporate mode: full and staff sites, finance on /full/*, staff on the rest, / leads to /staff/.</desc>
