name: stackledger

# Checks this catalogue and publishes its stackledger sites to Cloudflare Pages: full/ and staff/
# (the corporate mode, the default), or full/ only with `sites: [full]` in catalog/stackledger.yaml
# (the personal mode).
# Setup (secrets, variable, Cloudflare Access before the first deploy, rollback): README.md.
#
# - site: on every run. Scans the repository and its history for secrets (gitleaks), validates the
#   catalogue in catalog/ (errors fail, warnings do not), builds the sites dated today in UTC into
#   a folder outside the repository, and hands on only full/, staff/ (corporate mode), _headers,
#   robots.txt and _redirects.
# - deploy: only for main, never for a pull request, on a fresh runner with no checkout. Wrangler is
#   installed without its install scripts before any secret exists, and runs from a folder holding
#   only the site, so nothing else of this repository can be uploaded.
#
# Versions are pinned: actions by commit SHA (tag in a comment), stackledger, wrangler and gitleaks
# below. A same-day re-run deploys the same files; the weekly run moves renewal windows.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

# One group per ref: two deploys of main never overlap, and a running deploy is not cancelled.
concurrency:
  group: stackledger-${{ github.ref }}
  cancel-in-progress: false

env:
  STACKLEDGER: stackledger@0.3.0
  WRANGLER: wrangler@4.151.3
  GITLEAKS_VERSION: 8.30.1
  # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file.
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so gitleaks scans every commit.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Scan for secrets (gitleaks)
        run: |
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks" gitleaks
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --exit-code 1 .
      - name: Validate the catalogue
        run: |
          echo "Using $STACKLEDGER"
          npx --yes "$STACKLEDGER" validate catalog
      - name: Build date (UTC, computed once)
        run: echo "BUILD_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - name: Build the sites
        run: npx --yes "$STACKLEDGER" build catalog --out "$RUNNER_TEMP/site" --date "$BUILD_DATE"
      - name: Keep only what is published
        run: |
          mkdir -p "$RUNNER_TEMP/handoff/site"
          for entry in full _headers robots.txt _redirects; do
            cp -R "$RUNNER_TEMP/site/$entry" "$RUNNER_TEMP/handoff/site/"
          done
          # staff/ exists only in the corporate mode.
          if [ -d "$RUNNER_TEMP/site/staff" ]; then
            cp -R "$RUNNER_TEMP/site/staff" "$RUNNER_TEMP/handoff/site/"
          fi
          echo "$BUILD_DATE" > "$RUNNER_TEMP/handoff/build-date"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ runner.temp }}/handoff/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install wrangler (no secrets, no install scripts)
        run: npm install --prefix "$RUNNER_TEMP/wrangler" --ignore-scripts --no-audit --no-fund "$WRANGLER"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/deploy
      - name: Read the build date and leave only the site in the deploy folder
        run: |
          build_date=$(cat "$RUNNER_TEMP/deploy/build-date")
          [[ "$build_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "Unexpected build date: $build_date" >&2; exit 1; }
          mv "$RUNNER_TEMP/deploy/build-date" "$RUNNER_TEMP/build-date"
          echo "BUILD_DATE=$build_date" >> "$GITHUB_ENV"
      - name: Deploy to Cloudflare Pages
        working-directory: ${{ runner.temp }}/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.PAGES_PROJECT }}
          WRANGLER_SEND_METRICS: "false"
        run: >-
          "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" pages deploy site
          --project-name "$PAGES_PROJECT" --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "stackledger $BUILD_DATE $GITHUB_SHA"
